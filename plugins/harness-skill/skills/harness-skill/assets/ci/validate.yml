name: validate-harness

# Los hooks locales se pueden saltar con --no-verify.
# Esta validación corre en el servidor y no se puede saltar.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar harness
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh
